# Check that the package imports and the metamodel is usable.
#
# The generated metamodel modules and the textual emitter are pure stdlib, so
# the suites below run without lxml or sysmlpy.
#
# 3.9 is tested on ubuntu-22.04: the ubuntu-24.04+ runner images do not ship
# a 3.9 build, and the package still supports 3.9 (see requires-python).
name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: ubuntu-24.04
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Import the package
        run: python -c "import umlmeta; print('umlmeta', umlmeta.__version__)"
      - name: UML metamodel checks (stdlib only)
        run: python check.py
      - name: Profile checks (stdlib only)
        run: python check_profiles.py
      - name: BPMN metamodel checks (stdlib only)
        run: python check_bpmn.py
      - name: SysML v2 abstract syntax checks (stdlib only)
        run: python check_sysml2.py
      - name: EMOF writer checks (stdlib only)
        run: python check_emof_write.py
      - name: OCL translation checks (stdlib only)
        run: python check_ocl.py
